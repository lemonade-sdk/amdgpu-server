name: Build and Release AMD GPU Server

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ROCm/hip-ep release providing the gpu-test-package (AMDGPU/hipep EP + ROCm +
  # onnxruntime-genai). Bump to build against a newer EP drop.
  HIP_EP_VERSION: v0.2.0

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            asset: amdgpu-server-windows-x64.zip
            runson:
              group: dev_lab
              labels: [self-hosted, Windows, X64]
          - os: linux
            asset: amdgpu-server-linux-x64.tar.gz
            runson:
              group: dev_lab
              labels: [self-hosted, Linux, X64]
    runs-on: ${{ matrix.runson }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # ----------------------------- Windows -----------------------------
      - name: (win) Download hip-ep gpu-test-package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Windows PowerShell 5.1: disabling the progress bar makes large
          # Invoke-WebRequest downloads fast instead of crawling.
          $ProgressPreference = "SilentlyContinue"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ver = "${{ env.HIP_EP_VERSION }}"
          $url = "https://github.com/ROCm/hip-ep/releases/download/$ver/gpu-test-package-windows-$ver.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile pkg.zip -UseBasicParsing
          if (Test-Path pkg) { Remove-Item -Recurse -Force pkg }
          Expand-Archive -Path pkg.zip -DestinationPath pkg -Force
          $dll = Get-ChildItem -Path pkg -Recurse -Filter onnxruntime-genai.dll | Select-Object -First 1
          if (-not $dll) { throw "onnxruntime-genai.dll not found in package" }
          "AMDGPU_PKG_ROOT=$($dll.Directory.Parent.FullName)" >> $env:GITHUB_ENV

      - name: (win) Configure & build
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
          if (-not (Test-Path build\bin\Release\amdgpu-server.exe)) { throw "amdgpu-server.exe missing" }

      - name: (win) Smoke test (loads onnxruntime-genai.dll)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & build\bin\Release\amdgpu-server.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "amdgpu-server --help failed ($LASTEXITCODE)" }

      - name: (win) Package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          tar -a -c -f "${{ matrix.asset }}" -C build\bin\Release .
          Write-Host ("${{ matrix.asset }} = {0:N1} MB" -f ((Get-Item "${{ matrix.asset }}").Length/1MB))

      # ------------------------------ Linux ------------------------------
      - name: (linux) Download hip-ep gpu-test-package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ env.HIP_EP_VERSION }}"
          url="https://github.com/ROCm/hip-ep/releases/download/$ver/gpu-test-package-linux-$ver.zip"
          echo "Downloading $url"
          curl -fsSL "$url" -o pkg.zip
          rm -rf pkg && mkdir pkg
          # unzip preserves the .so symlink chain; fall back to bsdtar.
          if command -v unzip >/dev/null; then unzip -q pkg.zip -d pkg; else tar -xf pkg.zip -C pkg; fi
          so=$(find pkg -name libonnxruntime-genai.so | head -1)
          test -n "$so" || { echo "libonnxruntime-genai.so not found"; exit 1; }
          root=$(dirname "$(dirname "$so")")   # parent of lib/
          echo "AMDGPU_PKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: (linux) Configure & build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          test -f build/bin/amdgpu-server

      - name: (linux) Smoke test (loads libonnxruntime-genai.so)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./build/bin/amdgpu-server --help >/dev/null

      - name: (linux) Package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # tar preserves the .so symlink chain and exec bits.
          tar -czf "${{ matrix.asset }}" -C build/bin .
          echo "${{ matrix.asset }} = $(du -m "${{ matrix.asset }}" | cut -f1) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: AMD GPU Server ${{ github.ref_name }}
          body: |
            OpenAI-compatible OGA server for AMD GPUs (AMDGPU EP / gfx1151).

            Built against [ROCm/hip-ep ${{ env.HIP_EP_VERSION }}](https://github.com/ROCm/hip-ep/releases/tag/${{ env.HIP_EP_VERSION }}).
            Consumed by [Lemonade](https://github.com/lemonade-sdk/lemonade) as the `amdgpu-llm` backend.

            | Platform | Asset |
            |----------|-------|
            | Windows x64 | `amdgpu-server-windows-x64.zip` |
            | Linux x64   | `amdgpu-server-linux-x64.tar.gz` |

            Each bundles `amdgpu-server` with the AMDGPU EP / ROCm / ONNX Runtime
            GenAI runtime. Requires an AMD gfx1151 (Strix Halo) GPU with the AMD
            graphics driver / ROCm installed.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
